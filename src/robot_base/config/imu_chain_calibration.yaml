# Copy to a session directory, then fill measured entries before solving.
# T_A_B maps B into A. Matrices are row-major; distances m, angles rad, time s.
schema_version: 1
body_frame: base_footprint

# REQUIRED: external IMU sensing origin in body_frame. No automatic CAD defaults.
# Current URDF nominal value in base_footprint is [-0.493, 0, 0.1575].
# This is NOT a surveyed measurement. base_link and physical axle have different z!
t_body_external_m: [null, null, null]

# Prior sensor-to-body rotations, used to resolve the straight-line +/-x ambiguity.
# estimate: gravity + straight acceleration refine BOTH rotations.
# fixed: preserve BOTH matrices exactly; no straight phase required.
# Or use {external: fixed, mid360: estimate} to preserve the external anchor R.
rotation_mode: estimate
R_body_external: [1, 0, 0, 0, 1, 0, 0, 0, 1]
R_body_mid360: [0.7071067811865476, 0, 0.7071067811865476,
               0, 1, 0,
               -0.7071067811865476, 0, 0.7071067811865476]

# REQUIRED: MID360 IMU height minus external IMU height, in BODY axes.
# Measure sensing origins, not the LiDAR casing/point-cloud origin.
external_to_mid360_z_in_body_m: null

# null: estimate with variable-rate rotation, train/test consistency check.
# Number (including 0.0): freeze a previously calibrated time offset.
# Same event: stamp_external = stamp_mid360 + time_offset_s.
time_offset_s: null

# Driver values -> m/s^2 and rad/s. Never infer units from topic names alone.
# This repository's usual HIPNUC output is SI; original Livox driver output is g.
external_accel_scale: 1.0
external_gyro_scale: 1.0
mid360_accel_scale: 9.80665
mid360_gyro_scale: 1.0

# MID360 cloud -> built-in IMU (inverse of chip position in cloud coordinates).
# Confirm against the manual for the actual model/driver; the fit uses IMU origins.
factory_transform_confirmed: false
R_mid360_lidar: [1, 0, 0, 0, 1, 0, 0, 0, 1]
t_mid360_lidar_m: [-0.011, -0.02329, 0.04412]

# Defaults are diagnostic acceptance limits, NOT accuracy guarantees.
checks:
  sample_rate_hz: 200.0
  max_gap_s: 0.05
  integration_window_s: 0.15
  td_search_bound_s: 0.1
  max_td_split_difference_s: 0.003
  max_xy_split_difference_m: 0.02
  max_accel_rmse_m_s2: 0.1
